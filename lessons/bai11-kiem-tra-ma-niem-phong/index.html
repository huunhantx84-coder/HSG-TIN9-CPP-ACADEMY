      if (old && typeof node.animate === 'function') node.animate([{transform: `translate(${old.left-now.left}px,${old.top-now.top}px)`},{transform: 'translate(0,0)'}], {duration: Math.min(frame.duration || 1600, 1600), easing: 'cubic-bezier(.4,0,.2,1)'});
    }
    $('history').replaceChildren();
    frame.history.forEach(row => {const item = el('li'); item.append(el('span', 'history-label', row.label), el('span', 'history-text', row.text || 'Chưa thực hiện'), el('span', 'history-status', row.status || '')); $('history').append(item);});
    $('history-title').hidden = frame.history.length === 0; $('history').hidden = frame.history.length === 0;
    $('output').textContent = frame.output; $('output').classList.toggle('multiline', frame.output.includes('\n') || frame.output.length > 32);
    $('output-placeholder').hidden = frame.output.length > 0;
    $('output-status').textContent = meta.finished ? 'Hoàn tất ✓' : frame.output ? 'Đã có kết quả' : 'Chờ lệnh xuất';
  }
  const player = createPlayer(lesson, {onFrame: render});
  $('start').addEventListener('click', () => player.run().catch(error => {$('note').textContent = 'Lỗi mô phỏng: ' + error.message;}));
  $('reset').addEventListener('click', () => player.reset());
  player.start();
})();
